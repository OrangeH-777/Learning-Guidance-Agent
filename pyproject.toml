[project]
name = "learning-guidance-agent"
version = "0.1.0"
description = "Personalized learning resources with a multi-agent workflow"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a configured PostgreSQL test database",
    "live_model: explicitly enabled external model calls",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
